name: CI Debug and Release APKs

on:
  push:
    branches:
      - 'feature/*17'
  workflow_dispatch:

concurrency:
  group: ci-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rime-assets:
    name: Build pinned rime-frost assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout source and SDK submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache verified rime-frost archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/yuyan-rime
          key: rime-frost-${{ hashFiles('yuyansdk/rime-source/frost.lock') }}

      - name: Build all pinyin assets with pinned librime
        run: |
          source yuyansdk/rime-source/frost.lock
          mkdir -p "$HOME/.cache/yuyan-rime" "$GITHUB_WORKSPACE/rime-artifacts"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$HOME/.cache/yuyan-rime:/root/.cache/yuyan-rime" \
            -w /workspace/yuyansdk \
            "$RIME_BUILD_CONTAINER" \
            sh -euxc '
              . ./rime-source/frost.lock
              apk add --no-cache bash curl python3 "$RIME_COMPILER_PACKAGE"
              expected_package="$(printf "%s" "$RIME_COMPILER_PACKAGE" | tr = -)"
              test "$(apk info -v librime-tools)" = "$expected_package"
              ./rime-source/build-rime-assets.sh /workspace/rime-artifacts
            '

      - name: Upload reproducible Rime assets
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-rime-frost-${{ github.sha }}
          path: rime-artifacts/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build offline debug and release APKs
    needs: rime-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout source and SDK submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install generated Rime assets
        uses: actions/download-artifact@v5
        with:
          name: yuyan-rime-frost-${{ github.sha }}
          path: yuyansdk/src/main/assets/rime/build

      - name: Verify installed Rime assets
        run: |
          python3 yuyansdk/rime-source/verify-rime-assets.py \
            --assets yuyansdk/src/main/assets/rime/build \
            --expected-rime-version 1.11.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Create temporary debug keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/debug.jks \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build offline debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew :yuyansdk:testOfflineDebugUnitTest :app:assembleOfflineDebug :app:assembleOfflineRelease --stacktrace
        env:
          RELEASE_STORE_FILE: keystore/debug.jks
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSWORD: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-normal17-debug-${{ github.sha }}
          path: app/build/outputs/apk/offline/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-normal17-release-${{ github.sha }}
          path: app/build/outputs/apk/offline/release/*.apk
          if-no-files-found: error
          retention-days: 14
