name: CI Release APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build offline release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source and SDK submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive


      - name: Rebuild ZX17 Rime prism
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-bin
          chmod +x yuyansdk/rime-source/rebuild-zx17-prism.sh
          yuyansdk/rime-source/rebuild-zx17-prism.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package was removed from current SDK repositories.
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Create temporary CI signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/debug.jks \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Run SDK tests and build offline release APK
        run: |
          chmod +x gradlew
          ./gradlew :yuyansdk:testOfflineDebugUnitTest :app:assembleOfflineRelease --stacktrace
        env:
          RELEASE_STORE_FILE: keystore/debug.jks
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSWORD: android

      # This is a CI artifact signed with an ephemeral key, not a published release.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-offline-release-${{ github.sha }}
          path: app/build/outputs/apk/offline/release/*.apk
          if-no-files-found: error
          retention-days: 14
