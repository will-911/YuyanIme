name: CI Debug and Release APKs

on:
  push:
    branches:
      - 'feature/*17'
  workflow_dispatch:
concurrency:
  group: ci-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build offline debug and release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source and SDK submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive


      - name: Rebuild ZX17 Rime prism
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-bin
          chmod +x yuyansdk/rime-source/rebuild-zx17-prism.sh
          yuyansdk/rime-source/rebuild-zx17-prism.sh

      - name: Upload generated ZX17 prism
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-zx17-prism-${{ github.sha }}
          path: yuyansdk/src/main/assets/rime/build/double_pinyin_zx17.prism.bin
          if-no-files-found: error
          retention-days: 14

      # Temporary export so the generated binary can be committed to the SDK repo.
      - name: Export generated prism to branch
        run: |
          mkdir -p generated
          cp yuyansdk/src/main/assets/rime/build/double_pinyin_zx17.prism.bin generated/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/double_pinyin_zx17.prism.bin
          git commit -m 'ci: export generated ZX17 prism [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package was removed from current SDK repositories.
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Create temporary debug keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/debug.jks \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build offline debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew :yuyansdk:testOfflineDebugUnitTest :app:assembleOfflineDebug :app:assembleOfflineRelease --stacktrace
        env:
          RELEASE_STORE_FILE: keystore/debug.jks
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSWORD: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-zx17-debug-${{ github.sha }}
          path: app/build/outputs/apk/offline/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-zx17-release-${{ github.sha }}
          path: app/build/outputs/apk/offline/release/*.apk
          if-no-files-found: error
          retention-days: 14
